name: Backend CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: backend-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Compile and package backend
        runs-on: ubuntu-latest
        timeout-minutes: 15

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Java 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: maven
                  cache-dependency-path: backend/pom.xml

            - name: Compile application and tests, then build JAR
              run: bash ./mvnw --batch-mode --no-transfer-progress -DskipTests clean package
