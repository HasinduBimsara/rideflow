spring:
  application:
    name: rideflow-backend

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:postgresql://localhost:5432/rides
    username: ride
    password: ride_local_password

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: ride
    password: ride_local_password
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 5
          multiplier: 2
          max-interval: 10000ms

server:
  address: 127.0.0.1
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

rideflow:
  mqtt:
    url: tcp://127.0.0.1:1883
    username: ingestion
    password: ${RIDEFLOW_MQTT_PASSWORD}
